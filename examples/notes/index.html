<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  #t {
    width: 100%; height: 100%; border: 0; padding: 10px; box-sizing: border-box;
    background: #fffdf0; color: #333; resize: none; outline: none;
    font: 14px 'Segoe UI', 'Microsoft YaHei'; line-height: 1.5;
  }
</style>
</head>
<body>
<textarea id="t" placeholder="记点什么…（自动保存）" spellcheck="false"></textarea>
<script src="desk.js"></script>
<script>
  // InfiniteDesk Plugin SDK：desk.storage（按面板实例隔离，宿主 SQLite 持久化）
  const t = document.getElementById('t');
  let saveTimer = 0;

  desk.storage.get('text');
  desk.on('plugin.kv', m => {
    if (m.t === 'plugin.kv' && m.k === 'text' && m.v != null && !t.value) t.value = m.v;
  });

  t.addEventListener('input', () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => desk.storage.set('text', t.value), 400);
  });
</script>
</body>
</html>
